<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#16191c">
  <title>juryoku-hikkoshi</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.6 4.7l1.9.6A5 5 0 1 0 12 7v3L7.5 6 12 2z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M11 4h2v10h-2z"/><path d="M12 2l5 5h-10z"/><path d="M5 12h2v7h10v-7h2v9H5z"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M4 5h2v14H4z"/><path d="M8 12l10-7v14z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M10 5l-7 7 7 7v-4h10V9H10z"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M2 6h12v10H2z"/><path d="M15 9h4l3 3v4h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
  </svg>

  <div id="app">
    <!-- title -->
    <section id="screen-title" class="screen">
      <div class="title-wrap">
        <h1 data-i18n="app.title"></h1>
        <p class="tagline" data-i18n="app.tagline"></p>
        <ol class="steps">
          <li>
            <svg viewBox="0 0 120 80" aria-hidden="true">
              <rect width="120" height="80" fill="#7d868d"/>
              <rect x="4" y="4" width="34" height="72" fill="#30373d"/>
              <rect x="44" y="4" width="72" height="72" fill="#dfe3e6"/>
              <rect x="38" y="50" width="6" height="26" fill="#dfe3e6"/>
              <rect x="12" y="60" width="16" height="14" fill="#b98a52" stroke="#6e4f2b" stroke-width="1.5"/>
              <path d="M20 54 L20 46 L52 46 L52 62 L84 62" fill="none" stroke="#e0782c" stroke-width="3" stroke-dasharray="5 3"/>
              <path d="M92 62 l-9 -6 v12z" fill="#e0782c"/>
              <circle cx="20" cy="67" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
            </svg>
            <span data-i18n="howto.step1"></span>
          </li>
          <li>
            <svg viewBox="0 0 120 80" aria-hidden="true">
              <rect width="120" height="80" fill="#7d868d"/>
              <rect x="4" y="4" width="112" height="72" fill="#dfe3e6"/>
              <path d="M60 10 l22 22 h-12 v34 h-20 v-34 h-12z" fill="#e0782c" opacity="0.75"/>
              <rect x="12" y="20" width="18" height="16" fill="#b98a52" stroke="#6e4f2b" stroke-width="1.5" transform="rotate(-18 21 28)"/>
              <rect x="90" y="30" width="14" height="24" fill="#eef2f4" stroke="#59636b" stroke-width="1.5" transform="rotate(14 97 42)"/>
              <path d="M21 46 v10 M97 62 v8" stroke="#59636b" stroke-width="2" stroke-dasharray="3 3"/>
            </svg>
            <span data-i18n="howto.step2"></span>
          </li>
          <li>
            <svg viewBox="0 0 120 80" aria-hidden="true">
              <rect width="120" height="80" fill="#7d868d"/>
              <rect x="4" y="4" width="112" height="72" fill="#dfe3e6"/>
              <rect x="14" y="60" width="18" height="16" fill="#b98a52" stroke="#6e4f2b" stroke-width="1.5"/>
              <rect x="40" y="48" width="14" height="28" fill="#eef2f4" stroke="#59636b" stroke-width="1.5"/>
              <rect x="62" y="58" width="30" height="18" fill="#1e1f22"/>
              <text x="104" y="32" text-anchor="middle" font-size="26" font-weight="800" fill="#e0782c">¥</text>
            </svg>
            <span data-i18n="howto.step3"></span>
          </li>
        </ol>
        <p class="steps-note" data-i18n="howto.note"></p>
        <div class="menu">
          <button id="btn-daily" class="btn btn-primary" type="button"></button>
          <button id="btn-free" class="btn" type="button" data-i18n="menu.free"></button>
        </div>
        <dl class="records">
          <div><dt id="best-label"></dt></div>
          <div><dt id="ach-label"></dt></div>
        </dl>
        <ul id="ach-list" class="ach-list"></ul>
      </div>
    </section>

    <!-- game -->
    <section id="screen-game" class="screen" hidden>
      <header class="hud">
        <div class="hud-item"><span class="hud-k" data-i18n="hud.time"></span><span id="hud-time" class="hud-v">60.0</span></div>
        <div class="hud-item"><span class="hud-k" data-i18n="hud.delivered"></span><span id="hud-delivered" class="hud-v">0/0</span></div>
        <div class="hud-item"><span class="hud-k" data-i18n="hud.estimate"></span><span id="hud-estimate" class="hud-v">¥0</span></div>
        <button id="btn-rope" class="hud-item rope-btn" type="button"><span class="hud-k" data-i18n="hud.ropes"></span><span id="hud-ropes" class="hud-v">3</span></button>
        <button id="btn-pause" class="icon-btn" type="button"><svg><use href="#i-pause"/></svg><span class="sr" data-i18n="hud.pause"></span></button>
      </header>
      <div id="stage" class="stage">
        <canvas id="board"></canvas>
        <div id="callout" class="callout" hidden></div>
        <div id="brief" class="brief" hidden>
          <div class="brief-sheet">
            <p id="brief-kicker" class="brief-kicker"></p>
            <svg class="brief-fig" viewBox="0 0 240 96" aria-hidden="true">
              <rect width="240" height="96" fill="#7d868d"/>
              <rect x="6" y="6" width="66" height="84" fill="#30373d"/>
              <rect x="82" y="6" width="152" height="84" fill="#dfe3e6"/>
              <rect x="72" y="58" width="10" height="32" fill="#dfe3e6"/>
              <rect x="22" y="68" width="24" height="20" fill="#b98a52" stroke="#6e4f2b" stroke-width="2"/>
              <path d="M34 62 V48 H96 V76 H160" fill="none" stroke="#e0782c" stroke-width="4" stroke-dasharray="8 5"/>
              <path d="M172 76 l-13 -8 v16z" fill="#e0782c"/>
              <rect x="182" y="64" width="24" height="20" fill="#b98a52" stroke="#6e4f2b" stroke-width="2"/>
              <circle cx="206" cy="58" r="11" fill="#2e9d5b"/>
              <path d="M200 58 l4 5 l8 -9" fill="none" stroke="#ffffff" stroke-width="3"/>
              <text x="160" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#2e9d5b">+¥</text>
            </svg>
            <p id="brief-main" class="brief-main"></p>
            <p id="brief-sub" class="brief-sub"></p>
            <div class="brief-actions">
              <button id="btn-brief" class="btn btn-primary" type="button"><svg><use href="#i-play"/></svg><span id="brief-go"></span></button>
              <button id="btn-skip-practice" class="btn" type="button" hidden data-i18n="practice.skip"></button>
            </div>
          </div>
        </div>
        <div id="toast" class="toast" hidden></div>
      </div>
      <div id="pause" class="pause" hidden>
        <h2 data-i18n="pause.title"></h2>
        <div class="menu">
          <button id="btn-resume" class="btn btn-primary" type="button"><svg><use href="#i-play"/></svg><span data-i18n="pause.resume"></span></button>
          <button id="btn-quit" class="btn" type="button"><svg><use href="#i-back"/></svg><span data-i18n="pause.quit"></span></button>
        </div>
      </div>
    </section>

    <!-- result -->
    <section id="screen-result" class="screen" hidden>
      <div class="result-wrap">
        <article class="invoice">
          <div class="invoice-band"></div>
          <h2 data-i18n="result.invoice"></h2>
          <p id="inv-stage" class="inv-stage"></p>
          <p class="inv-rule" data-i18n="result.rule"></p>
          <table class="inv-lines">
            <thead><tr><th data-i18n="result.colItem"></th><th class="num" data-i18n="result.colReward"></th><th class="num" data-i18n="result.colDamage"></th></tr></thead>
            <tbody id="inv-lines"></tbody>
          </table>
          <div class="inv-sum">
            <div><span data-i18n="result.reward"></span><span id="inv-reward"></span></div>
            <div><span data-i18n="result.damage"></span><span id="inv-damage" class="neg"></span></div>
            <div class="inv-total"><span data-i18n="result.total"></span><span id="inv-total"></span></div>
          </div>
          <p id="inv-missed" class="inv-missed" hidden></p>
          <p id="inv-best" class="inv-best" hidden data-i18n="result.newBest"></p>
          <p id="inv-comment" class="inv-comment"></p>
          <h3 data-i18n="result.achievements"></h3>
          <ul id="inv-ach" class="ach-list"></ul>
        </article>
        <div class="result-actions">
          <button id="btn-retry" class="btn btn-primary" type="button"><svg><use href="#i-retry"/></svg><span data-i18n="result.retry"></span></button>
          <button id="btn-replay" class="btn" type="button"><svg><use href="#i-replay"/></svg><span data-i18n="result.replay"></span></button>
          <button id="btn-share" class="btn" type="button"><svg><use href="#i-share"/></svg><span data-i18n="result.share"></span></button>
          <button id="btn-menu" class="btn" type="button"><svg><use href="#i-back"/></svg><span data-i18n="result.menu"></span></button>
        </div>
        <p id="share-note" class="share-note" hidden></p>
      </div>
      <div id="replay" class="replay" hidden>
        <div class="replay-bar"><span data-i18n="replay.label"></span><button id="btn-replay-close" class="btn" type="button" data-i18n="replay.close"></button></div>
        <canvas id="replay-canvas"></canvas>
      </div>
    </section>
  </div>

  <script src="vendor/matter.min.js"></script>
  <script src="src/i18n.js?v=8"></script>
  <script src="src/rules.js?v=8"></script>
  <script src="src/sim.js?v=8"></script>
  <script src="src/storage.js?v=8"></script>
  <script src="src/audio.js?v=8"></script>
  <script src="src/render.js?v=8"></script>
  <script src="src/share.js?v=8"></script>
  <script src="src/app.js?v=8"></script>
</body>
</html>
